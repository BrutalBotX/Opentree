name: Windows Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# The release job attaches the installer to a GitHub release, which needs write access.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtwebchannel'

      - name: Install the WebEngine modules explicitly
        shell: pwsh
        run: |
          python -m pip install --quiet aqtinstall
          # WebEngine needs its optional dependencies too: WebEngineCore requires Positioning
          # (and WebChannel/Qml), so a kit with only qtwebengine leaves the graph disabled.
          python -m aqt install-qt windows desktop 6.8.0 win64_msvc2022_64 --modules qtwebengine qtwebchannel qtpositioning --outputdir "$env:QT_ROOT_DIR\..\.."
          if ($LASTEXITCODE -ne 0) { throw "aqt failed to install the WebEngine modules (exit $LASTEXITCODE)" }

      - name: Check that the Qt kit has WebEngine
        shell: pwsh
        run: |
          $required = @(
            'bin\Qt6WebEngineWidgets.dll',
            'bin\Qt6WebEngineCore.dll',
            'bin\Qt6WebChannel.dll',
            'bin\Qt6Positioning.dll',
            'lib\cmake\Qt6WebEngineWidgets\Qt6WebEngineWidgetsConfig.cmake',
            'lib\cmake\Qt6WebEngineCore\Qt6WebEngineCoreConfig.cmake',
            'lib\cmake\Qt6WebChannel\Qt6WebChannelConfig.cmake',
            'lib\cmake\Qt6Positioning\Qt6PositioningConfig.cmake',
            'lib\cmake\Qt6Quick\Qt6QuickConfig.cmake',
            'lib\cmake\Qt6QuickWidgets\Qt6QuickWidgetsConfig.cmake'
          )
          $missing = @()
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $env:QT_ROOT_DIR $file))) { $missing += $file }
          }
          if ($missing.Count -gt 0) {
            Write-Host "missing: $($missing -join ', ')"
            throw "The Qt kit is missing WebEngine pieces: $($missing -join ', ')"
          }
          Write-Host "WebEngine present in $env:QT_ROOT_DIR"

      - name: Probe the Qt kit with CMake
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path probe | Out-Null
          @'
          cmake_minimum_required(VERSION 3.24)
          project(probe LANGUAGES CXX)
          find_package(Qt6 REQUIRED COMPONENTS Widgets)
          find_package(Qt6 QUIET COMPONENTS WebEngineWidgets WebChannel)
          if (TARGET Qt6::WebEngineWidgets)
            message(STATUS "PROBE: aggregate Qt6 WebEngineWidgets target present")
          else()
            message(STATUS "PROBE: aggregate Qt6 WebEngineWidgets target MISSING")
          endif()
          find_package(Qt6WebEngineWidgets QUIET)
          if (TARGET Qt6::WebEngineWidgets)
            message(STATUS "PROBE: Qt6WebEngineWidgets package usable")
          else()
            message(FATAL_ERROR "PROBE: Qt6WebEngineWidgets package NOT usable")
          endif()
          '@ | Set-Content -Path probe\CMakeLists.txt -Encoding utf8
          $qtBin = (Get-ChildItem (Join-Path $env:QT_ROOT_DIR 'bin') -Filter 'Qt6Web*' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', '
          $qtCmake = (Get-ChildItem (Join-Path $env:QT_ROOT_DIR 'lib\cmake') -Filter 'Qt6Web*' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', '
          $probe = (& cmake -S probe -B probe-build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" 2>&1 | Out-String)
          @(
            "QT_ROOT_DIR: $env:QT_ROOT_DIR",
            "bin: $qtBin",
            "lib/cmake: $qtCmake",
            "",
            "--- cmake probe output ---",
            $probe
          ) | Set-Content -Path ci-diagnostics.txt -Encoding utf8
          Write-Host $probe

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-msvc -G "NMake Makefiles" -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" -DCMAKE_BUILD_TYPE=Release 2>&1 |
            Tee-Object -FilePath build-msvc\configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cmake --build build-msvc --config Release

      - name: Check that the build really has the graph
        shell: pwsh
        run: |
          $dumpbin = (Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
          $imports = (& $dumpbin /dependents build-msvc\OpenTree.exe) -join "`n"
          $engineLinked = $imports -match 'Qt6WebEngineWidgets.dll'
          $processDeployed = Test-Path 'build-msvc\QtWebEngineProcess.exe'
          $configureLines = ((Select-String -Path build-msvc\configure.log -Pattern 'OpenTree:|WebEngine|WebChannel' -ErrorAction SilentlyContinue |
            Select-Object -First 8 | ForEach-Object { $_.Line.Trim() }) -join "`n")
          $cacheLines = ((Select-String -Path build-msvc\CMakeCache.txt -Pattern 'WebEngine|WebChannel|QT_ADDITIONAL|Qt6_DIR' -ErrorAction SilentlyContinue |
            Select-Object -First 8 | ForEach-Object { $_.Line.Trim() }) -join "`n")
          $diagnostics = @(
            "links Qt6WebEngineWidgets: $engineLinked",
            "QtWebEngineProcess deployed: $processDeployed",
            "QT_ROOT_DIR: $env:QT_ROOT_DIR",
            "",
            "--- configure log (OpenTree/WebEngine lines) ---",
            $configureLines,
            "",
            "--- CMakeCache ---",
            $cacheLines,
            "",
            "--- OpenTree.exe imports (Qt) ---",
            (($imports -split "`n") | Where-Object { $_ -match 'Qt6' } | ForEach-Object { $_.Trim() }) -join ", "
          ) -join "`n"
          # The step summary shows up as the check run's output text, which the API serves
          # without authentication - unlike the job log.
          $diagnostics | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host $diagnostics
          if (-not $engineLinked -or -not $processDeployed) {
            throw "build-msvc\OpenTree.exe does not use WebEngine - the installed app would have no graph."
          }
          Write-Host "Graph support verified in build-msvc\OpenTree.exe"

      - name: Test
        run: ctest --test-dir build-msvc -R core --output-on-failure

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = ''
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = ($env:GITHUB_REF -replace 'refs/tags/v?', '')
          }
          if (-not $version) {
            $match = Select-String -Path CMakeLists.txt -Pattern 'project\(OpenTree VERSION ([0-9.]+)' | Select-Object -First 1
            if ($match) { $version = $match.Matches[0].Groups[1].Value }
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Installer version: $version"

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" "installer\OpenTree.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenTree-Setup-${{ steps.version.outputs.value }}
          path: installer/output/OpenTree-Setup-*.exe
          if-no-files-found: error

      - name: Publish CI diagnostics
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          # A readable channel for CI-only problems (job logs need authentication, the
          # diagnostics branch does not). Read it from the ci-diagnostics branch.
          $lines = @()
          if (Test-Path ci-diagnostics.txt) { $lines += (Get-Content ci-diagnostics.txt) }
          $lines += ""
          $lines += "--- configure log (WebEngine lines) ---"
          if (Test-Path build-msvc\configure.log) {
            $lines += (Select-String -Path build-msvc\configure.log -Pattern 'OpenTree:|WebEngine|WebChannel' -ErrorAction SilentlyContinue |
              Select-Object -First 12 | ForEach-Object { $_.Line.Trim() })
          }
          $lines += ""
          $lines += "--- build without the graph? ---"
          if (Test-Path build-msvc\OpenTree.exe) {
            $dumpbin = (Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
            $imports = (& $dumpbin /dependents build-msvc\OpenTree.exe) -join "`n"
            $lines += "links Qt6WebEngineWidgets: $($imports -match 'Qt6WebEngineWidgets.dll')"
            $lines += "QtWebEngineProcess deployed: $(Test-Path 'build-msvc\QtWebEngineProcess.exe')"
          } else {
            $lines += "no OpenTree.exe was produced"
          }
          $lines | Set-Content -Path ci-diagnostics.txt -Encoding utf8

          git config user.email "ci@opentree.invalid"
          git config user.name "OpenTree CI"
          git checkout --orphan ci-diagnostics
          git rm -r --cached . 2>$null | Out-Null
          git add -f ci-diagnostics.txt
          git commit -m "CI diagnostics for $env:GITHUB_SHA"
          git push -f origin ci-diagnostics

      - name: Publish diagnostics (temporary)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $diagnostics = "D:\diagnostics.txt"
          $lines = @()
          $lines += "sha: $env:GITHUB_SHA"
          $lines += "QT_ROOT_DIR: $env:QT_ROOT_DIR"
          $lines += ""
          $lines += "--- configure log (last 80 lines) ---"
          if (Test-Path build-msvc\configure.log) { $lines += (Get-Content build-msvc\configure.log -Tail 80) } else { $lines += "no configure.log" }
          $lines += ""
          $lines += "--- CMakeCache (Qt/WebEngine) ---"
          if (Test-Path build-msvc\CMakeCache.txt) {
            $lines += (Select-String -Path build-msvc\CMakeCache.txt -Pattern 'Qt6|WebEngine|WebChannel' -ErrorAction SilentlyContinue |
              Select-Object -First 30 | ForEach-Object { $_.Line.Trim() })
          }
          $lines += ""
          $lines += "--- exe imports ---"
          if (Test-Path build-msvc\OpenTree.exe) {
            $dumpbin = (Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
            $lines += ((& $dumpbin /dependents build-msvc\OpenTree.exe) | Where-Object { $_ -match 'Qt6' } | ForEach-Object { $_.Trim() })
          } else { $lines += "no OpenTree.exe" }
          $lines -join "`n" | Set-Content -Path $diagnostics -Encoding utf8

          # Publish to a throw-away branch so the job log (unreadable without auth) is not
          # needed. Force push keeps it simple.
          git config user.email "ci@opentree.invalid"
          git config user.name "OpenTree CI"
          git checkout --orphan ci-diagnostics
          git rm -r --cached . --quiet
          git add -f ci-diagnostics.txt 2>$null
          Copy-Item $diagnostics .\ci-diagnostics.txt -Force
          git add -f ci-diagnostics.txt
          git commit -m "ci diagnostics for $env:GITHUB_SHA"
          git push -f origin ci-diagnostics

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/OpenTree-Setup-*.exe
          generate_release_notes: true
